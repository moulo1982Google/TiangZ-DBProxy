name: coverage

# 代码覆盖率：Rust 工作区默认测试，加上 CI 已经在真实 PostgreSQL/Redis 上跑的 #[ignore] 回归（每组用新库），合并成一份报告；
# 再加 TypeScript SDK 测试。上传 Codecov（仓库密钥 CODECOV_TOKEN）。
# Code coverage: default Rust workspace tests plus the #[ignore] real PostgreSQL/Redis regressions that CI already runs
# (a fresh database per suite), merged into one report; plus the TypeScript SDK tests. Uploaded to Codecov.
# Docker fault matrices, scale/cost probes and process acceptance stay out: they kill containers or need release binaries.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust 覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DBPROXY_TEST_ALLOW_SCHEMA_MIGRATION: "1"
      DBPROXY_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/tiangz
      # Same as the release acceptance job: the storage suite's request-shard tests need it too.
      DBPROXY_TEST_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/tiangz
      DBPROXY_REDIS_URL: redis://:tiangz_dev@127.0.0.1:6379/0
      DBPROXY_CACHE_REDIS_URL: redis://:tiangz_dev@127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: 启动 PostgreSQL、可靠 Redis 与无 AOF 的缓存 Redis
        run: |
          cp deploy/local/.env.example deploy/local/.env
          docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml -f deploy/local/docker-compose.validation.yml up -d --wait postgres redis cache
      - name: 工作区默认测试
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --workspace --locked
      - name: 真实 PostgreSQL 回归（每组新库）
        run: |
          set -euo pipefail
          # suite <db> <cargo selection...> [:: <test filter>]; cargo llvm-cov reads a bare test
          # name as a subcommand, so a filter goes to the test binary after "--".
          suite() {
            local db=$1; shift
            local selection=() filter=()
            while [ $# -gt 0 ] && [ "$1" != "::" ]; do selection+=("$1"); shift; done
            if [ "${1:-}" = "::" ]; then shift; filter=("$@"); fi
            docker exec tiangz-dbproxy-postgres createdb -U tiangz "$db"
            DBPROXY_TEST_POSTGRES_URL="postgres://tiangz:tiangz_dev@127.0.0.1:5432/$db" \
              cargo llvm-cov --no-report --locked "${selection[@]}" -- --ignored --test-threads=1 "${filter[@]}"
          }
          suite cov_indexes -p tiangz-dbproxy-storage --test schema_indexes
          suite cov_plans -p tiangz-dbproxy-storage --test query_plans --test repair_claim_plans --test outbox_hybrid_plans
          suite cov_outbox -p tiangz-dbproxy-storage --test outbox_concurrency
          suite cov_receipts -p tiangz-dbproxy-storage --test receipt_retention
          suite cov_retirement -p tiangz-dbproxy-storage --test operation_retirement
          suite cov_repair -p tiangz-dbproxy-storage --test cache_repair_concurrency
          # 库默认排序规则若已是字节序，该回归不构成反例，直接失败。 / Fail if the default collation is byte order.
          DBPROXY_TEST_REQUIRE_LINGUISTIC_COLLATION=1 suite cov_receipt_order -p tiangz-dbproxy-storage --test receipt_key_order
          suite cov_worker -p tiangz-dbproxy-server --test receipt_cleanup_worker
          # Library-internal real-database tests (read pool, connection diagnostics); exact names.
          suite cov_read_pool -p tiangz-dbproxy-storage --lib :: postgres_read_pool::tests::real_read_pool_paths_capacity_cancellation_and_reconnect
          suite cov_diagnostics -p tiangz-dbproxy-storage --lib :: postgres_diagnostics::tests::real_postgres_identity_reconnect_and_contention
          # Capacity sampling refuses any database not named v07_capacity.
          docker exec tiangz-dbproxy-postgres createdb -U tiangz v07_capacity
          DBPROXY_CAPACITY_TEST_URL=postgres://tiangz:tiangz_dev@127.0.0.1:5432/v07_capacity \
            cargo llvm-cov --no-report --locked -p tiangz-dbproxy-storage --lib -- --ignored --test-threads=1 capacity::tests::postgres
      - name: 真实 PostgreSQL + Redis 存储与网络闭环
        run: |
          cargo llvm-cov --no-report --locked -p tiangz-dbproxy-storage --test postgres_redis -- --ignored --test-threads=1
          cargo llvm-cov --no-report --locked -p tiangz-dbproxy-server --test postgres_redis_network -- --ignored --test-threads=1
      - name: Outbox 发布任务（可靠 Redis 成功，无 AOF Redis 重试与死信）
        env:
          DBPROXY_TEST_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/cov_outbox_worker
          DBPROXY_TEST_NO_AOF_REDIS_URL: redis://:tiangz_dev@127.0.0.1:6380/0
        run: |
          docker exec tiangz-dbproxy-postgres createdb -U tiangz cov_outbox_worker
          cargo llvm-cov --no-report --locked -p tiangz-dbproxy-server --test outbox_worker -- --ignored --test-threads=1
      - name: 真实服务进程（双进程同库、双租户强杀重启）
        # The tests spawn the cargo-built server binary, which is instrumented too.
        env:
          ACCEPT_PG_A: postgres://tiangz:tiangz_dev@127.0.0.1:5432/cov_process_a
          ACCEPT_PG_B: postgres://tiangz:tiangz_dev@127.0.0.1:5432/cov_process_b
          ACCEPT_REDIS_A: redis://:tiangz_dev@127.0.0.1:6379/2
          ACCEPT_REDIS_B: redis://:tiangz_dev@127.0.0.1:6379/3
          ACCEPT_CACHE_A: redis://:tiangz_dev@127.0.0.1:6380/2
          ACCEPT_CACHE_B: redis://:tiangz_dev@127.0.0.1:6380/3
        run: |
          docker exec tiangz-dbproxy-postgres createdb -U tiangz cov_process_a
          docker exec tiangz-dbproxy-postgres createdb -U tiangz cov_process_b
          DBPROXY_ACCEPTANCE_ARTIFACTS="$RUNNER_TEMP/process-acceptance"             cargo llvm-cov --no-report --locked -p tiangz-dbproxy-server --test acceptance_process -- --ignored --test-threads=1
      - name: 生成合并报告
        run: cargo llvm-cov report --workspace --lcov --output-path rust-lcov.info
      - name: 上传到 Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust-lcov.info
          flags: rust
          fail_ci_if_error: true
      - name: 清理测试容器
        if: always()
        run: docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml -f deploy/local/docker-compose.validation.yml down -v --remove-orphans

  typescript:
    name: TypeScript SDK 覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:typescript
      # Node 一次跑多个测试文件时，合并各子进程的覆盖率会丢掉大量已执行的行（实测把约 90% 报成 43%）。
      # 每个文件单独出一份报告，由 Codecov 取并集。
      # Node mis-merges coverage across test-file subprocesses (about 90% was reported as 43%);
      # emit one report per file and let Codecov take the union.
      - name: SDK 测试覆盖率（经 source map 映射回 TypeScript 源文件，逐文件）
        run: |
          set -euo pipefail
          for file in sdk/typescript/test/*.test.mjs; do
            name=$(basename "$file" .test.mjs)
            node --enable-source-maps --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=lcov --test-reporter-destination="sdk-lcov-$name.info" "$file"
          done
          ls sdk-lcov-*.info
      - name: 上传到 Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sdk-lcov-*.info
          flags: typescript
          fail_ci_if_error: true
