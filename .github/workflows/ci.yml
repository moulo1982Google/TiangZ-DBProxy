name: Rust CI

permissions:
  contents: read

on:
  push:
  pull_request:
  release:
    types: [published]
  # 完整验收（真实 PG/Redis 与故障矩阵）此前只在打标签时跑，问题要拖到发版才暴露；每晚在主分支跑一次。
  # The full acceptance (real PostgreSQL/Redis and the fault matrix) used to run only on tags, so problems surfaced at
  # release time; run it nightly on main as well.
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:

jobs:
  indexes:
    name: PostgreSQL 全库索引回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: tiangz
          POSTGRES_PASSWORD: tiangz_dev
          POSTGRES_DB: index_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiangz -d index_regression"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DBPROXY_TEST_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/index_regression
      DBPROXY_TEST_ALLOW_SCHEMA_MIGRATION: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 空库、索引漂移和十万条历史数据回归
        run: cargo test -p tiangz-dbproxy-storage --test schema_indexes --locked -- --ignored --nocapture --test-threads=1
      - name: 批量读取与队列积压查询回归
        env:
          DBPROXY_TEST_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/query_plan_regression
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U tiangz query_plan_regression
          cargo test -p tiangz-dbproxy-storage --test query_plans --test repair_claim_plans --test outbox_hybrid_plans --locked -- --ignored --nocapture --test-threads=1
      - name: Outbox 顺序与并发回归
        env:
          DBPROXY_TEST_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/outbox_safety_regression
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U tiangz outbox_safety_regression
          cargo test -p tiangz-dbproxy-storage --test outbox_concurrency --locked -- --ignored --nocapture --test-threads=1

      - name: 普通回执保留期与清理索引回归
        env:
          DBPROXY_TEST_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/receipt_regression
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U tiangz receipt_regression
          cargo test -p tiangz-dbproxy-storage --test receipt_retention --locked -- --ignored --nocapture --test-threads=1

  check:
    name: 格式、测试与 Clippy
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: 检查格式
        run: cargo fmt --all -- --check
      - name: 运行测试
        run: cargo test --workspace
      - name: 运行 Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 校验可观测性配置
        run: |
          cp deploy/local/.env.example deploy/local/.env
          docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml config --quiet
          python -m json.tool deploy/local/observability/grafana/dashboards/dbproxy-overview.json >/dev/null
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/local/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml

  release:
    name: 发布前完整验收
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    needs: [check, indexes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBPROXY_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/tiangz
      DBPROXY_TEST_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/tiangz
      DBPROXY_TEST_ALLOW_SCHEMA_MIGRATION: "1"
      DBPROXY_REDIS_URL: redis://:tiangz_dev@127.0.0.1:6379/0
      DBPROXY_RUN_DOCKER_FAULTS: "1"
      DBPROXY_TEST_COMPOSE_PROJECT: tiangz-dbproxy-local
      DBPROXY_TEST_POSTGRES_CONTAINER: tiangz-dbproxy-postgres
      DBPROXY_TEST_REDIS_CONTAINER: tiangz-dbproxy-redis
      DBPROXY_TEST_CACHE_CONTAINER: tiangz-dbproxy-cache
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装锁定的 TypeScript 依赖
        run: npm ci
      - name: 发布 Rust 格式检查
        run: cargo fmt --all -- --check
      - name: 发布 Rust 测试
        run: cargo test --workspace --locked
      - name: 发布 Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 发布 TypeScript SDK 测试
        run: npm run test:typescript
      - name: 准备本地集成测试配置
        run: cp deploy/local/.env.example deploy/local/.env
      - name: 启动 PostgreSQL、可靠 Redis 与缓存 Redis
        # 叠加 validation：故障矩阵要强杀独立的缓存 Redis（6380、无AOF/RDB、tmpfs），基础 compose 不含它。
        # Overlay validation: the fault matrix kills the separate cache Redis (6380, no AOF/RDB, tmpfs) that the base compose omits.
        run: docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml -f deploy/local/docker-compose.validation.yml up -d --wait
      - name: 真实存储测试
        env:
          DBPROXY_CACHE_REDIS_URL: redis://:tiangz_dev@127.0.0.1:6379/0
        run: cargo test -p tiangz-dbproxy-storage --test postgres_redis --locked -- --ignored --nocapture --test-threads=1
      - name: 缓存修复租约与并发回归
        env:
          DBPROXY_TEST_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/repair_regression
        run: |
          docker exec tiangz-dbproxy-postgres createdb -U tiangz repair_regression
          cargo test -p tiangz-dbproxy-storage --test cache_repair_concurrency --locked -- --ignored --nocapture --test-threads=1
      - name: 真实网络闭环测试
        run: cargo test -p tiangz-dbproxy-server --test postgres_redis_network --locked -- --ignored --nocapture --test-threads=1
      - name: 普通回执后台清理回归
        env:
          DBPROXY_TEST_ALLOW_SCHEMA_MIGRATION: "1"
          DBPROXY_TEST_POSTGRES_URL: postgres://tiangz:tiangz_dev@127.0.0.1:5432/receipt_worker_regression
        run: |
          docker exec tiangz-dbproxy-postgres createdb -U tiangz receipt_worker_regression
          cargo test -p tiangz-dbproxy-server --test receipt_cleanup_worker --locked -- --ignored --nocapture --test-threads=1
      - name: Redis 与 PostgreSQL 故障矩阵
        env:
          DBPROXY_CACHE_REDIS_URL: redis://:tiangz_dev@127.0.0.1:6380/0
        run: cargo test -p tiangz-dbproxy-storage --test fault_matrix --locked -- --ignored --nocapture --test-threads=1
      - name: 清理测试容器
        if: always()
        run: docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml -f deploy/local/docker-compose.validation.yml down -v --remove-orphans
