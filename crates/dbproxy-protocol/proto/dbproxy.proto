syntax = "proto3";

package tiangz.dbproxy.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1001;
  ERROR_CODE_UNAUTHORIZED = 1002;
  ERROR_CODE_PROTOCOL_MISMATCH = 1003;
  ERROR_CODE_REVISION_CONFLICT = 2001;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 2002;
  ERROR_CODE_OPERATION_CONFLICT = 2003;
  ERROR_CODE_TRADE_CONFLICT = 2004;
  ERROR_CODE_LEDGER_CONFLICT = 2005;
  ERROR_CODE_OUTBOX_CONFLICT = 2006;
  ERROR_CODE_STORAGE_UNAVAILABLE = 3001;
  ERROR_CODE_INTERNAL = 9000;
}

enum WriteDisposition {
  WRITE_DISPOSITION_UNSPECIFIED = 0;
  WRITE_DISPOSITION_APPLIED = 1;
  WRITE_DISPOSITION_DUPLICATE = 2;
}

enum TradeState {
  TRADE_STATE_UNSPECIFIED = 0;
  TRADE_STATE_PROPOSED = 1;
  TRADE_STATE_ESCROWED = 2;
  TRADE_STATE_SETTLED = 3;
  TRADE_STATE_CANCELLED = 4;
}

message RpcError {
  ErrorCode code = 1;
  string message = 2;
  optional uint64 actual_revision = 3;
}

message RecordKey {
  string namespace = 1;
  string key = 2;
}

message SnapshotEnvelope {
  RecordKey record = 1;
  string schema = 2;
  uint32 schema_version = 3;
  uint64 revision = 4;
  bytes payload = 5;
  uint64 updated_at_unix_ms = 6;
}

message LoadSnapshotRequest {
  RecordKey record = 1;
}

message LoadSnapshotResponse {
  SnapshotEnvelope snapshot = 1;
}

message LoadMultiSnapshotRequest {
  repeated RecordKey records = 1;
}

// Entries preserve request order. A missing snapshot represents an absent record.
message LoadMultiSnapshotEntry {
  SnapshotEnvelope snapshot = 1;
}

message LoadMultiSnapshotResponse {
  repeated LoadMultiSnapshotEntry entries = 1;
}

message SaveSnapshotRequest {
  string request_id = 1;
  RecordKey record = 2;
  string schema = 3;
  uint32 schema_version = 4;
  bytes payload = 5;
  optional uint64 expected_revision = 6;
  uint64 updated_at_unix_ms = 7;
}

message SaveSnapshotResponse {
  WriteDisposition disposition = 1;
  uint64 revision = 2;
}

message SaveMultiSnapshotRequest {
  repeated SaveSnapshotRequest writes = 1;
}

// Entries preserve request order. A record error does not roll back successful siblings.
message SaveMultiSnapshotEntry {
  SaveSnapshotResponse result = 1;
  RpcError error = 2;
}

message SaveMultiSnapshotResponse {
  repeated SaveMultiSnapshotEntry entries = 1;
}

message EnqueueSnapshotRequest {
  SaveSnapshotRequest write = 1;
}

message EnqueueSnapshotResponse {
  bool accepted = 1;
}

message EnqueueMultiSnapshotRequest {
  repeated SaveSnapshotRequest writes = 1;
}

message EnqueueMultiSnapshotEntry {
  bool accepted = 1;
  RpcError error = 2;
}

message EnqueueMultiSnapshotResponse {
  repeated EnqueueMultiSnapshotEntry entries = 1;
}

message ApplyTransactionRequest {
  string operation_id = 1;
  RecordKey record = 2;
  string schema = 3;
  uint32 schema_version = 4;
  uint64 expected_revision = 5;
  bytes payload = 6;
  bytes result = 7;
  uint64 updated_at_unix_ms = 8;
}

message ApplyTransactionResponse {
  WriteDisposition disposition = 1;
  uint64 new_revision = 2;
  bytes result = 3;
}

message LoadTransactionRequest {
  string operation_id = 1;
  RecordKey record = 2;
}

message TransactionReceipt {
  string operation_id = 1;
  RecordKey record = 2;
  uint64 new_revision = 3;
  bytes result = 4;
}

message LoadTransactionResponse {
  TransactionReceipt receipt = 1;
}

message TransactionalRecordWrite {
  RecordKey record = 1;
  string schema = 2;
  uint32 schema_version = 3;
  uint64 expected_revision = 4;
  bytes payload = 5;
  uint64 updated_at_unix_ms = 6;
}

message ApplyMultiTransactionRequest {
  string operation_id = 1;
  repeated TransactionalRecordWrite writes = 2;
  bytes result = 3;
}

message MultiTransactionRecordReceipt {
  RecordKey record = 1;
  uint64 new_revision = 2;
}

message ApplyMultiTransactionResponse {
  WriteDisposition disposition = 1;
  repeated MultiTransactionRecordReceipt records = 2;
  bytes result = 3;
}

message LoadMultiTransactionRequest {
  string operation_id = 1;
  repeated RecordKey records = 2;
}

message MultiTransactionReceipt {
  string operation_id = 1;
  repeated MultiTransactionRecordReceipt records = 2;
  bytes result = 3;
}

message LoadMultiTransactionResponse {
  MultiTransactionReceipt receipt = 1;
}

// Opaque immutable facts; identities are independent from snapshot identities.
message AppendRecord {
  RecordKey record = 1;
  string schema = 2;
  uint32 schema_version = 3;
  bytes payload = 4;
  uint64 occurred_at_unix_ms = 5;
}

// Separate RPC so older servers cannot silently discard transaction effects.
message CommitRecordsRequest {
  string operation_id = 1;
  repeated TransactionalRecordWrite writes = 2;
  bytes result = 3;
  repeated AppendRecord appends = 4;
  repeated OutboxEvent outbox_events = 5;
}

message TradeEnvelope {
  string trade_id = 1;
  uint64 version = 2;
  TradeState state = 3;
  bytes payload = 4;
  uint64 updated_at_unix_ms = 5;
}

message TradeTransition {
  string trade_id = 1;
  uint64 expected_version = 2;
  optional TradeState expected_state = 3;
  TradeState next_state = 4;
  bytes payload = 5;
  uint64 updated_at_unix_ms = 6;
}

message LedgerPosting {
  string posting_id = 1;
  string account_id = 2;
  string asset = 3;
  sint64 amount = 4;
  bytes metadata = 5;
}

message OutboxEvent {
  string event_id = 1;
  string topic = 2;
  string partition_key = 3;
  bytes payload = 4;
  uint64 occurred_at_unix_ms = 5;
}

message ApplyTradeTransactionRequest {
  string operation_id = 1;
  TradeTransition transition = 2;
  repeated TransactionalRecordWrite writes = 3;
  repeated LedgerPosting ledger_postings = 4;
  repeated OutboxEvent outbox_events = 5;
  bytes result = 6;
}

message TradeReceipt {
  string operation_id = 1;
  string trade_id = 2;
  uint64 new_trade_version = 3;
  TradeState state = 4;
  repeated MultiTransactionRecordReceipt records = 5;
  repeated string ledger_posting_ids = 6;
  repeated string outbox_event_ids = 7;
  bytes result = 8;
}

message ApplyTradeTransactionResponse {
  WriteDisposition disposition = 1;
  TradeReceipt receipt = 2;
}

message LoadTradeRequest {
  string trade_id = 1;
}

message LoadTradeResponse {
  TradeEnvelope trade = 1;
}

message LoadTradeTransactionRequest {
  string operation_id = 1;
  string trade_id = 2;
}

message LoadTradeTransactionResponse {
  TradeReceipt receipt = 1;
}

message RequestEnvelope {
  uint64 rpc_id = 1;
  oneof body {
    LoadSnapshotRequest load_snapshot = 10;
    SaveSnapshotRequest save_snapshot = 11;
    EnqueueSnapshotRequest enqueue_snapshot = 12;
    ApplyTransactionRequest apply_transaction = 13;
    LoadTransactionRequest load_transaction = 14;
    ApplyMultiTransactionRequest apply_multi_transaction = 15;
    LoadMultiTransactionRequest load_multi_transaction = 16;
    LoadMultiSnapshotRequest load_multi_snapshot = 17;
    SaveMultiSnapshotRequest save_multi_snapshot = 18;
    EnqueueMultiSnapshotRequest enqueue_multi_snapshot = 19;
    ApplyTradeTransactionRequest apply_trade_transaction = 20;
    LoadTradeRequest load_trade = 21;
    LoadTradeTransactionRequest load_trade_transaction = 22;
    CommitRecordsRequest commit_records = 23;
  }
}

message ResponseEnvelope {
  uint64 rpc_id = 1;
  RpcError error = 2;
  oneof body {
    LoadSnapshotResponse load_snapshot = 10;
    SaveSnapshotResponse save_snapshot = 11;
    EnqueueSnapshotResponse enqueue_snapshot = 12;
    ApplyTransactionResponse apply_transaction = 13;
    LoadTransactionResponse load_transaction = 14;
    ApplyMultiTransactionResponse apply_multi_transaction = 15;
    LoadMultiTransactionResponse load_multi_transaction = 16;
    LoadMultiSnapshotResponse load_multi_snapshot = 17;
    SaveMultiSnapshotResponse save_multi_snapshot = 18;
    EnqueueMultiSnapshotResponse enqueue_multi_snapshot = 19;
    ApplyTradeTransactionResponse apply_trade_transaction = 20;
    LoadTradeResponse load_trade = 21;
    LoadTradeTransactionResponse load_trade_transaction = 22;
    ApplyMultiTransactionResponse commit_records = 23;
  }
}

message ClientHello {
  uint32 protocol_version = 1;
  string protocol_fingerprint = 2;
  string auth_token = 3;
  string client_name = 4;
}

message ServerHello {
  uint32 protocol_version = 1;
  string protocol_fingerprint = 2;
  bool accepted = 3;
  RpcError error = 4;
  // Recognizes the versioned generic Outbox envelope and immutable relay routing contract.
  bool supports_outbox_relay = 5;
}

message ClientFrame {
  oneof body {
    ClientHello hello = 1;
    RequestEnvelope request = 2;
  }
}

message ServerFrame {
  oneof body {
    ServerHello hello = 1;
    ResponseEnvelope response = 2;
  }
}
