[package]
name = "tiangz-dbproxy-server"
default-run = "tiangz-dbproxy-server"
version = "0.7.3"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "TiangZ DBProxy 的独立 TCP 服务"

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
redis.workspace = true
tokio-postgres.workspace = true
sha2.workspace = true
thiserror.workspace = true
tiangz-dbproxy-core = { path = "../dbproxy-core" }
tiangz-dbproxy-protocol = { path = "../dbproxy-protocol" }
tiangz-dbproxy-storage = { path = "../dbproxy-storage" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# 崩溃诊断：两者都已在依赖树中（tokio/mio 等引入），这里只是直接使用并打开所需特性。
# Crash diagnostics: both are already in the dependency tree; used directly here with the needed features.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
tiangz-dbproxy-client = { path = "../dbproxy-client" }

[features]
acceptance-trace = ["tiangz-dbproxy-storage/acceptance-trace"]
