[package]
name = "TiangZ-DBProxy"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
authors = ["郑昕"]
repository = "https://github.com/moulo1982Google/TiangZ-DBProxy"
description = "TiangZ 独立持久化服务的公共门面包"
publish = false

[lib]
name = "tiangz_dbproxy"
path = "src/lib.rs"

[workspace]
resolver = "2"
members = [
    "crates/dbproxy-client",
    "crates/dbproxy-core",
    "crates/dbproxy-protocol",
    "crates/dbproxy-server",
    "crates/dbproxy-storage",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["郑昕"]
repository = "https://github.com/moulo1982Google/TiangZ-DBProxy"

[workspace.dependencies]
async-trait = "0.1"
bincode = { version = "2.0.1", features = ["serde"] }
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
redis = { version = "1.5.0", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies]
tiangz-dbproxy-core = { path = "crates/dbproxy-core" }
tiangz-dbproxy-client = { path = "crates/dbproxy-client" }
tiangz-dbproxy-protocol = { path = "crates/dbproxy-protocol" }
tiangz-dbproxy-storage = { path = "crates/dbproxy-storage" }
