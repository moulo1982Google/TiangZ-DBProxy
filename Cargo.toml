[workspace]
resolver = "2"
members = ["crates/dbproxy-core", "crates/dbproxy-storage"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["郑昕"]
repository = "https://github.com/moulo1982Google/TiangZ-DBProxy"

[workspace.dependencies]
async-trait = "0.1"
bincode = "1.3"
redis = { version = "0.32", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = "0.7"
tracing = "0.1"
