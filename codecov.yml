# Codecov 配置。刚接入时检查只提示、不拦合并，看清基线后再决定是否收紧。
# Codecov settings: status checks are informational for now and never block a merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# 两份报告分别标记 rust 与 typescript，各自统计。
# The two reports carry the rust and typescript flags and are tracked separately.
flags:
  rust:
    paths:
      - src/
      - crates/
  typescript:
    paths:
      - sdk/typescript/src/

# 根包 src/bin 下是压测、浸泡与探针工具，不随服务发布，不计入覆盖率；示例程序同理。
# The src/bin load, soak and probe tools and the examples are test harnesses, not shipped service code.
ignore:
  - "src/bin/**"
  - "crates/*/examples/**"

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true
