global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: tiangz-dbproxy
    static_configs:
      - targets:
          - host.docker.internal:9090
          - host.docker.internal:9091

  - job_name: tiangz-process
    static_configs:
      - targets:
          - host.docker.internal:7600
          - host.docker.internal:7603
          - host.docker.internal:7604
          - host.docker.internal:7606
          - host.docker.internal:7608
          - host.docker.internal:7610
