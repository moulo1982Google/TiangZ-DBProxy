name: tiangz-dbproxy-local

services:
  postgres:
    image: postgres:18.4-bookworm
    container_name: tiangz-dbproxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DBPROXY_POSTGRES_USER:?DBPROXY_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${DBPROXY_POSTGRES_PASSWORD:?DBPROXY_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${DBPROXY_POSTGRES_DB:?DBPROXY_POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${DBPROXY_POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 使用按大版本划分的子目录，必须挂载整个父目录。
      # PostgreSQL 18 stores data below a major-version directory; mount the parent volume.
      - tiangz-dbproxy-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.8.1-trixie
    container_name: tiangz-dbproxy-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${DBPROXY_REDIS_PASSWORD:?DBPROXY_REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${DBPROXY_REDIS_PASSWORD:?DBPROXY_REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${DBPROXY_REDIS_PORT:-6379}:6379"
    volumes:
      - tiangz-dbproxy-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: tiangz-dbproxy-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${DBPROXY_PROMETHEUS_PORT:-9095}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - tiangz-dbproxy-prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.0
    container_name: tiangz-dbproxy-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${DBPROXY_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${DBPROXY_GRAFANA_ADMIN_PASSWORD:?DBPROXY_GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${DBPROXY_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tiangz-dbproxy-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  tiangz-dbproxy-postgres-data:
  tiangz-dbproxy-redis-data:
  tiangz-dbproxy-prometheus-data:
  tiangz-dbproxy-grafana-data:
